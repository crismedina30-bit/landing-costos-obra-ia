<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Costos de Obra con IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --bg: #0d1117;
    --bg-soft: #121923;
    --panel: rgba(19, 28, 39, 0.7);
    --line: rgba(255, 255, 255, 0.1);
    --line-strong: rgba(230, 187, 132, 0.18);
    --text: #f3f5f7;
    --muted: #a6b0bb;
    --accent: #d6a66a;
    --accent-strong: #e6bb84;
    --accent-deep: #c89254;
    --shadow: 0 30px 90px rgba(0, 0, 0, 0.35);
  }

  html, body {
    margin: 0;
    min-height: 100%;
    background:
      radial-gradient(circle at 12% 18%, rgba(214, 166, 106, 0.16), transparent 26%),
      radial-gradient(circle at 88% 82%, rgba(83, 123, 173, 0.18), transparent 24%),
      linear-gradient(135deg, #0d1117 0%, #10161f 48%, #0b1016 100%);
    color: var(--text);
    font-family: 'Inter', Arial, sans-serif;
  }

  body {
    overflow-x: hidden;
  }

  body::before,
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
  }

  body::before {
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(circle at center, black 30%, transparent 78%);
    opacity: 0.18;
  }

  body::after {
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent 28%, transparent 72%, rgba(255, 255, 255, 0.02)),
      radial-gradient(circle at 50% 50%, rgba(230, 187, 132, 0.05), transparent 34%);
  }

  .page {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 28px;
  }

  .shell {
    width: min(1160px, 100%);
    position: relative;
    border: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(17, 24, 34, 0.88), rgba(13, 18, 26, 0.94));
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .shell::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(120deg, rgba(214, 166, 106, 0.12), transparent 30%),
      linear-gradient(300deg, rgba(120, 154, 198, 0.12), transparent 28%);
    pointer-events: none;
  }

  .shell::after {
    content: "";
    position: absolute;
    inset: 22px;
    border: 1px solid rgba(255, 255, 255, 0.06);
    pointer-events: none;
  }

  .shell-grid {
    position: absolute;
    inset: 22px;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(230, 187, 132, 0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(230, 187, 132, 0.045) 1px, transparent 1px);
    background-size: 88px 88px;
    mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.65), transparent 85%);
  }

  .hero {
    position: relative;
    display: flex;
    justify-content: center;
    padding: 72px;
  }

  .hero-copy {
    max-width: 1020px;
    text-align: center;
  }

  .mark {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 28px;
    color: var(--accent-strong);
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
  }

  .mark::before {
    content: "";
    width: 44px;
    height: 1px;
    background: currentColor;
  }

  h1 {
    margin: 0;
    max-width: 19ch;
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: clamp(1.82rem, 3.25vw, 3.28rem);
    font-weight: 400;
    line-height: 1.11;
    letter-spacing: -0.03em;
    text-wrap: balance;
  }

  .highlight {
    color: var(--accent-strong);
    font-style: italic;
    text-shadow: 0 0 26px rgba(230, 187, 132, 0.14);
  }

  .actions {
    margin-top: 20px;
    display: flex;
    justify-content: center;
  }

  .cta {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    min-width: 260px;
    padding: 16px 28px;
    border: 1px solid var(--line-strong);
    background: linear-gradient(180deg, rgba(230, 187, 132, 0.14), rgba(214, 166, 106, 0.08));
    color: var(--accent-strong);
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    transition: transform 180ms ease, border-color 180ms ease, background 180ms ease, box-shadow 180ms ease;
    box-shadow: 0 14px 28px rgba(214, 166, 106, 0.08);
  }

  .cta:hover {
    transform: translateY(-2px);
    border-color: rgba(230, 187, 132, 0.45);
    background: linear-gradient(180deg, rgba(230, 187, 132, 0.19), rgba(214, 166, 106, 0.11));
    box-shadow: 0 18px 34px rgba(214, 166, 106, 0.12);
    color: #f0c792;
  }

  .cta:focus-visible {
    outline: 2px solid var(--accent-strong);
    outline-offset: 4px;
  }

  .cta svg {
    width: 18px;
    height: 18px;
    flex: none;
  }

  .footer {
    position: relative;
    padding: 0 72px 34px;
    color: var(--muted);
    font-size: 0.8rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  @media (max-width: 920px) {
    .hero {
      padding: 52px 28px 36px;
    }

    h1 {
      max-width: 100%;
    }

    .footer {
      padding: 0 28px 28px;
    }

    .shell::after {
      inset: 14px;
    }

    .shell-grid {
      inset: 14px;
      background-size: 64px 64px;
    }
  }

  @media (max-width: 560px) {
    .page {
      padding: 14px;
    }

    .hero {
      padding: 42px 22px 28px;
    }

    .mark {
      margin-bottom: 22px;
      letter-spacing: 0.16em;
    }

    .cta {
      width: 100%;
      min-width: 0;
      padding: 17px 22px;
    }

    .footer {
      padding: 0 22px 22px;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
    }

    .shell-grid {
      background-size: 48px 48px;
    }
  }
</style>
</head>
